name: random_sequence_generator
description: "Random sequences, passwords, coin flips, and dice"
publish_to: 'none'

# Legacy was 2.2.2 / versionCode 222, so 300 keeps Play upgrades valid.
version: 3.0.0+300

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Must match the SDK's pin or gen-l10n breaks. flutter_localizations in
  # Flutter 3.44.8 pins intl 0.20.2, so this constraint cannot go higher.
  intl: ^0.20.2
  # Decided storage: cross-platform, no native configuration.
  shared_preferences: ^2.5.5
  # The only cross-platform share sheet; maps 1:1 to the legacy ACTION_SEND chooser.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Reaches the test suite transitively through flutter_test, but has to be
  # declared for depend_on_referenced_packages.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#333333"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
